name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Architecture Check
        run: npm run arch:check

      - name: Build
        run: npm run build

      - name: Unit Test
        run: npm run test -- --runInBand
